      <rect x="42" y="38" width="14" height="10" fill="#fff"/>
      <path d="M35 52a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H39a4 4 0 0 1-4-4z" fill="#fff"/>
      <rect x="35" y="60" width="28" height="11" fill="#85B7EB"/>
